name: Deploy react
on:
  push:
    branches:
      - master


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} 
      - run: docker run -e CI=true gerhmansparrow/multi-test npm run test


      - run: docker build -t gerhmansparrow/multi-client ./client
      - run: docker build -t gerhmansparrow/multi-server ./server
      - run: docker build -t gerhmansparrow/multi-nginx ./nginx 
      - run: docker build -t gerhmansparrow/multi-worker ./worker

      - run: docker push gerhmansparrow/multi-client
      - run: docker push gerhmansparrow/multi-server
      - run: docker push gerhmansparrow/multi-nginx
      - run: docker push gerhmansparrow/multi-worker
